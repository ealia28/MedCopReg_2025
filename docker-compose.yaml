version: '3.9'

services:
  db:
    image: mysql:8.1
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medcopreg
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uuser", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: clinic_container
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://user:password@db/medcopreg
    volumes:
      - ./clinic_app:/app
    command: flask run --host=0.0.0.0

volumes:
  db_data:
